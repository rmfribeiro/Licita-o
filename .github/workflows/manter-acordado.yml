name: Manter o app acordado

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visitar o app
        continue-on-error: true
        run: |
          URL="https://licita-o-o6lxthd8oqe7qjck7wzzwr.streamlit.app"
          echo "Visitando $URL"
          CODIGO=$(curl -sS -o /dev/null -w "%{http_code}" \
                     --max-time 120 --max-redirs 10 -L "$URL" 2>&1 || echo "falhou")
          echo "Resultado: $CODIGO"
          echo "Visita concluida — o trafego ja evita a hibernacao."
          exit 0
